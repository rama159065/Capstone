# Annual Report Copilot: Qdrant + FastAPI + Streamlit, plus optional HTTPS (Caddy).
#
#   cp .env.example .env            # fill in the LLM endpoint and API_AUTH_TOKEN
#   docker compose up -d --build    # http://localhost:8501 (UI), http://localhost:8000/docs (API)
#   docker compose --profile https up -d   # on a server with a domain name: https://$DOMAIN
#
# Restore the Colab index once (snapshots copied from Drive into ./snapshots):
#   docker compose run --rm api python -m scripts.rag.financial_ingest restore \
#       --root /app/indexes/financial_qdrant --qdrant-url http://qdrant:6333 --snapshot-dir /snapshots
# See docs/deployment.md.
name: annual-report-copilot

x-app: &app
  build: .
  image: annual-report-copilot:latest
  restart: unless-stopped
  env_file: .env
  user: "${APP_UID:-1000}:${APP_GID:-1000}"
  environment:
    RAG_PROFILE: server
    QDRANT_URL: http://qdrant:6333
    API_BASE_URL: http://api:8000
  volumes:
    - ./indexes:/app/indexes                       # financial_qdrant/ (ingest state), chroma/, state/, hf_cache/
    - ./data/processed:/app/data/processed:ro      # BM25 chunks of the Chroma domains
    - ${SNAPSHOT_DIR:-./snapshots}:/snapshots:ro   # Qdrant snapshots from Drive, for restore
    - qdrant_snapshots:/qdrant/snapshots           # same path as in the Qdrant container (restore hands it a file:// URI)

services:
  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:latest}   # pin to the version that wrote the Colab snapshots, or newer
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  api:
    <<: *app
    command: ["uvicorn", "scripts.api.api_app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1",
              "--proxy-headers", "--forwarded-allow-ips", "*"]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

  ui:
    <<: *app
    command: ["streamlit", "run", "scripts/ui/api_streamlit_app.py", "--server.address", "0.0.0.0",
              "--server.port", "8501", "--server.headless", "true", "--browser.gatherUsageStats", "false"]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8501:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:                                           # HTTPS + basic auth in front of the UI (and /api/* -> FastAPI)
    profiles: ["https"]
    image: caddy:2.8
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - ui
      - api

volumes:
  qdrant_storage:
  qdrant_snapshots:
  caddy_data:
