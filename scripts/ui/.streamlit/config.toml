# Theme of the Financial Report Copilot UI. Streamlit reads this file relative to api_streamlit_app.py.
[client]
toolbarMode = "viewer"   # hides the Deploy button and developer menu; viewers keep print and the theme switch

[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
baseRadius = "medium"
showWidgetBorder = true

[theme.light]
primaryColor = "#1D4E89"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#14213D"
linkColor = "#0F7C80"
borderColor = "#D5DEE9"
chartCategoricalColors = ["#1D4E89", "#0FA3A3", "#F2A541", "#C8553D", "#6C8EAD", "#7FB77E", "#9B5DE5", "#B8C4D6"]

[theme.light.sidebar]
backgroundColor = "#EEF3F9"
secondaryBackgroundColor = "#FFFFFF"

[theme.dark]
primaryColor = "#2EC4B6"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#16213A"
textColor = "#E6EDF5"
linkColor = "#5FD3C7"
borderColor = "#24324D"
chartCategoricalColors = ["#5B9BE6", "#2EC4B6", "#F2A541", "#E07A5F", "#93B5C6", "#8FD694", "#BF8EF7", "#D6DEE8"]

[theme.dark.sidebar]
backgroundColor = "#0F1A2E"
secondaryBackgroundColor = "#16213A"
